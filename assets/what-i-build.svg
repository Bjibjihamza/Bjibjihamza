  <path d="M40 64 c0 2.2 4.5 4 10 4 s10-1.8 10-4" fill="none" stroke="#a5b4fc" stroke-width="1.6"/>
  <text x="28" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#fafafa">Data Engineering</text>
