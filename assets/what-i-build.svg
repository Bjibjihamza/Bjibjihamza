  <text x="700" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#fafafa">Full-Stack Development</text>
  <text x="700" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#818cf8">END-TO-END SOLUTIONS</text>
