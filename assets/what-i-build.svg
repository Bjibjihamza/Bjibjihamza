  <line x1="700" y1="250" x2="952" y2="250" stroke="#27272a" stroke-width="1"/>
  <text x="700" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2.5" fill="#71717a">TECHNOLOGIES</text>
