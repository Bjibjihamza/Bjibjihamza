    <rect x="490" y="394" width="126" height="26" rx="13" fill="#18181b" stroke="#3f3f46"/>
    <text x="553" y="411" text-anchor="middle">Forecasting systems</text>
  </g>

  <!-- Card 03 -->
  <g filter="url(#soft)">
    <rect x="672" y="20" width="308" height="480" rx="16" fill="#111113" stroke="#27272a" stroke-width="1.5"/>
  </g>
  <text x="940" y="78" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" fill="#27272a">03</text>
  <rect x="700" y="44" width="44" height="44" rx="10" fill="url(#iconBg)" stroke="#4f46e5" stroke-width="1"/>
  <!-- code brackets -->
