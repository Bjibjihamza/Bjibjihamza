    <text x="80" y="155" text-anchor="middle" fill="#c9d1d9">First</text>
    <text x="80" y="170" text-anchor="middle" fill="#c9d1d9">commit</text>

    <circle cx="230" cy="120" r="8" fill="#a5d6ff"/>
    <text x="230" y="95" text-anchor="middle" fill="#a5d6ff">2025-04</text>
    <text x="230" y="155" text-anchor="middle" fill="#c9d1d9">Kafka</text>
    <text x="230" y="170" text-anchor="middle" fill="#c9d1d9">Car Price</text>

    <circle cx="380" cy="120" r="8" fill="#ffa657"/>
    <text x="380" y="95" text-anchor="middle" fill="#a5d6ff">2025-10</text>
    <text x="380" y="155" text-anchor="middle" fill="#c9d1d9">Threat</text>
    <text x="380" y="170" text-anchor="middle" fill="#c9d1d9">Intel + BI</text>

    <circle cx="530" cy="120" r="8" fill="#63b985"/>
