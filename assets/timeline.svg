    <text x="530" y="155" text-anchor="middle" fill="#c9d1d9">Lakehouse</text>
    <text x="530" y="170" text-anchor="middle" fill="#c9d1d9">Iceberg</text>

    <circle cx="680" cy="120" r="8" fill="#ffa657"/>
