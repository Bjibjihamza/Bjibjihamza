    <circle cx="830" cy="120" r="8" fill="#a5d6ff"/>
    <text x="830" y="95" text-anchor="middle" fill="#a5d6ff">2026-04</text>
    <text x="830" y="155" text-anchor="middle" fill="#c9d1d9">EDUPATH</text>
    <text x="830" y="170" text-anchor="middle" fill="#c9d1d9">live</text>
