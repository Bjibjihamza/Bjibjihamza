<svg xmlns="http://www.w3.org/2000/svg" width="980" height="220" viewBox="0 0 980 220" role="img" aria-label="Growth timeline">
  <rect width="980" height="220" rx="16" fill="#161b22"/>
  <rect x="1" y="1" width="978" height="218" rx="15" fill="none" stroke="#30363d" stroke-width="2"/>
  <text x="36" y="42" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffa657">Growth path</text>

  <line x1="60" y1="120" x2="920" y2="120" stroke="#30363d" stroke-width="3"/>

  <!-- nodes -->
  <g font-family="Consolas, Menlo, monospace" font-size="11">
    <circle cx="80" cy="120" r="8" fill="#ffa657"/>
