<svg xmlns="http://www.w3.org/2000/svg" width="980" height="180" viewBox="0 0 980 180" role="img" aria-label="Hamza Bjibji">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1c2430"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffa657"/>
      <stop offset="100%" stop-color="#a5d6ff"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#a5d6ff" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="980" height="180" rx="18" fill="url(#bg)"/>
  <rect width="980" height="180" rx="18" fill="url(#dots)"/>
  <rect x="1" y="1" width="978" height="178" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- Monogram tile -->
  <rect x="36" y="36" width="108" height="108" rx="22" fill="#0d1117" stroke="url(#accent)" stroke-width="2.5"/>
  <text x="90" y="108" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="url(#accent)">HB</text>

  <!-- Wordmark -->
  <text x="172" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#e6edf3">Hamza Bjibji</text>
  <text x="172" y="124" font-family="Consolas, Menlo, monospace" font-size="18" fill="#a5d6ff">AI &amp; Data Engineer  ·  Tétouan, Morocco</text>

  <!-- Accent bar -->
  <rect x="172" y="140" width="220" height="4" rx="2" fill="url(#accent)"/>

  <!-- Right decorative nodes -->
  <g opacity="0.9">
    <circle cx="820" cy="55" r="6" fill="#ffa657"/>
    <circle cx="870" cy="90" r="5" fill="#a5d6ff"/>
    <circle cx="910" cy="50" r="4" fill="#63b985"/>
    <circle cx="850" cy="130" r="5" fill="#ffa657"/>
    <line x1="820" y1="55" x2="870" y2="90" stroke="#616b7f" stroke-width="1.5"/>
    <line x1="870" y1="90" x2="910" y2="50" stroke="#616b7f" stroke-width="1.5"/>
    <line x1="870" y1="90" x2="850" y2="130" stroke="#616b7f" stroke-width="1.5"/>
  </g>
</svg>
